name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack project
        run: unzip -q MosquitoSmash-source.zip

      - name: Build installable debug APK
        working-directory: mosquito_cam_game
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: cp mosquito_cam_game/app/build/outputs/apk/debug/app-debug.apk MosquitoSmash.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MosquitoSmash-apk
          path: MosquitoSmash.apk
          if-no-files-found: error
