name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q MosquitoSmash-source.zip

      - name: Apply Fun V2
        run: |
          cp v2/GameView.java mosquito_cam_game/app/src/main/java/com/saeid/mosquitosmash/GameView.java
          sed -i 's/versionCode 1/versionCode 2/' mosquito_cam_game/app/build.gradle
          sed -i "s/versionName '1.0'/versionName '2.0'/" mosquito_cam_game/app/build.gradle

      - name: Build installable debug APK
        working-directory: mosquito_cam_game
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: cp mosquito_cam_game/app/build/outputs/apk/debug/app-debug.apk MosquitoSmash-FunV2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MosquitoSmash-FunV2-apk
          path: MosquitoSmash-FunV2.apk
          if-no-files-found: error
