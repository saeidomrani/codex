name: Build Fashion Studio APK

on:
  push:
    branches: [ fashion-studio-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild and verify source archive
        run: |
          cat fashionstudio_chunks/chunk_* > FashionStudio_Android_v1.zip.b64
          base64 -d FashionStudio_Android_v1.zip.b64 > FashionStudio_Android_v1.zip
          unzip -t FashionStudio_Android_v1.zip
          unzip -q FashionStudio_Android_v1.zip

      - name: Apply build fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('FashionStudio/app/build.gradle.kts')
          s = p.read_text()
          needle = 'android {\n'
          patch = '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          '''
          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              s = s.replace(needle, patch, 1)
          p.write_text(s)

          p = Path('FashionStudio/app/src/main/java/com/openai/fashionstudio/ui/DesignCanvas.kt')
          s = p.read_text()
          if 'import androidx.compose.ui.graphics.drawscope.drawIntoCanvas' not in s:
              s = s.replace(
                  'import androidx.compose.ui.graphics.drawscope.Stroke\n',
                  'import androidx.compose.ui.graphics.drawscope.Stroke\nimport androidx.compose.ui.graphics.drawscope.drawIntoCanvas\n'
              )
          p.write_text(s)

          p = Path('FashionStudio/app/src/main/java/com/openai/fashionstudio/ui/DesignerScreen.kt')
          s = p.read_text().replace(
              'import androidx.compose.ui.draw.border',
              'import androidx.compose.foundation.border'
          )
          p.write_text(s)
          PY

      - name: Build installable debug APK
        working-directory: FashionStudio
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp FashionStudio/app/build/outputs/apk/debug/app-debug.apk FashionStudio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FashionStudio-apk
          path: FashionStudio.apk
          if-no-files-found: error
